<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aiTeams — Multi-Agent Workspace</title>
  <!--
    Mockup giao diện aiTeams (thiết kế v2):
    - AI Team gồm 1..n AI Agent
    - Project 1..n Workflow, Workflow 0..n Ticket
    - Thứ tự tạo: Project -> Workflow (xuất bản) -> Ticket -> mở cửa sổ chat
    Tham chiếu spec: docs/specs/IMPLEMENTATION_PLAN.md, PHASE_4/5/6.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #EBE9D8; color: #1C1C1A; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .agent-pill { display: inline-flex; align-items: center; gap: 3px; background-color: #EFECE1; border: 1px solid #DFDDD0; padding: 1px 6px; border-radius: 6px; font-weight: 600; font-size: 12px; color: #2C2C2A; }
    .side-item { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 8px; color: #44403c; font-weight: 500; transition: background .15s; }
    .side-item:hover { background: rgba(223,221,208,.6); }
    .side-item.active { background: #D6D4C4; color: #1c1917; font-weight: 600; }
    .btn-dark { background: #1c1917; color: #fff; border-radius: 10px; font-size: 12px; font-weight: 500; padding: 7px 13px; display: inline-flex; align-items: center; gap: 6px; }
    .btn-dark:hover { background: #292524; }
    .btn-dark:disabled { background: #a8a29e; cursor: not-allowed; }
    .btn-light { background: #fff; border: 1px solid #d6d3d1; border-radius: 10px; font-size: 12px; font-weight: 500; padding: 6px 12px; color: #44403c; display: inline-flex; align-items: center; gap: 6px; }
    .btn-light:hover { background: #fafaf9; }
    .inp { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #d6d3d1; background: #fff; font-size: 12px; }
    .inp:focus { outline: none; border-color: #78716c; }
    .lbl { display: block; color: #57534e; font-weight: 500; margin-bottom: 4px; font-size: 12px; }
    .typing span { animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D5D3C2; border-radius: 99px; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex p-2.5 select-none">

  <!-- ========================= SIDEBAR ========================= -->
  <aside class="w-64 flex flex-col justify-between pr-2.5 shrink-0 text-[13px] min-h-0">
    <div class="space-y-4 min-h-0 flex flex-col">
      <div class="space-y-3 px-2 pt-1 shrink-0">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <span class="w-3 h-3 rounded-full bg-[#FF5F56] border border-black/10"></span>
            <span class="w-3 h-3 rounded-full bg-[#FFBD2E] border border-black/10"></span>
            <span class="w-3 h-3 rounded-full bg-[#27C93F] border border-black/10"></span>
          </div>
          <span class="text-[11px] font-mono text-stone-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>ACP Connected</span>
        </div>
      </div>

      <!-- Global menu -->
      <div class="space-y-0.5 px-1 shrink-0">
        <button onclick="go('inbox')" id="nav-inbox" class="side-item">
          <span class="flex items-center gap-2"><i data-lucide="bell" class="w-4 h-4 text-stone-600"></i> Thông báo</span>
          <span id="inbox-badge" class="text-[11px] font-mono bg-stone-800 text-white px-1.5 rounded-full">0</span>
        </button>
        <button onclick="go('agents')" id="nav-agents" class="side-item">
          <span class="flex items-center gap-2"><i data-lucide="bot" class="w-4 h-4 text-stone-600"></i> Agents & Teams</span>
          <span id="agent-count" class="text-[11px] text-stone-500 font-mono">0</span>
        </button>
      </div>

      <!-- Project -> Workflow -> Ticket tree -->
      <div class="px-1 flex-1 min-h-0 overflow-y-auto space-y-1" id="project-tree"></div>
    </div>

    <div class="px-2.5 py-2 rounded-xl hover:bg-[#DFDDD0]/60 transition flex items-center gap-2.5 cursor-pointer shrink-0 mt-2">
      <div class="relative shrink-0">
        <div class="w-8 h-8 rounded-full bg-stone-800 text-white flex items-center justify-center font-semibold text-xs">NH</div>
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-[#EBE9D8] absolute -bottom-0.5 -right-0.5"></span>
      </div>
      <div class="truncate">
        <div class="text-xs font-semibold text-stone-900 truncate">Nguyen Manh Hung</div>
        <div id="user-path" class="text-[10px] font-mono text-stone-500 truncate"></div>
      </div>
    </div>
  </aside>

  <!-- ========================= MAIN PANEL ========================= -->
  <main class="flex-1 bg-white rounded-2xl border border-stone-300/80 shadow-sm flex flex-col overflow-hidden min-w-0">

    <!-- VIEW: CHAT (ticket) -->
    <div id="view-chat" class="flex-1 hidden flex-col overflow-hidden">
      <header class="border-b border-stone-200 px-5 py-2 shrink-0">
        <div id="chat-breadcrumb" class="text-[11px] text-stone-400 flex items-center gap-1"></div>
        <div class="flex items-center justify-between mt-0.5">
          <div class="flex items-center gap-2 min-w-0">
            <span id="chat-title" class="font-bold text-sm text-stone-900 truncate"></span>
            <span class="text-xs text-stone-400">•</span>
            <span id="chat-path" class="text-xs font-mono text-stone-500 bg-stone-100 px-2 py-0.5 rounded truncate"></span>
            <span id="chat-status"></span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <div class="flex items-center gap-1 px-2.5 py-1 rounded-lg border border-stone-200 text-xs text-stone-600">
              <i data-lucide="users" class="w-3.5 h-3.5"></i><span id="member-count">0</span>
            </div>
            <button onclick="openCurrentWorkflow()" title="Xem workflow của ticket" class="p-1.5 rounded-lg border border-stone-200 text-stone-600 hover:bg-stone-50">
              <i data-lucide="git-merge" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      </header>

      <div id="messages-stream" class="flex-1 overflow-y-auto px-6 py-4 space-y-5 select-text text-[13.5px] leading-relaxed"></div>

      <div class="px-5 pt-2 pb-1 shrink-0">
        <div id="clarify-hint" class="hidden mb-2 px-3 py-2 rounded-lg border border-amber-200 bg-amber-50 text-xs text-amber-900"></div>
        <div id="composer" class="border border-stone-300 rounded-xl bg-white p-3 focus-within:border-stone-500 transition shadow-sm"
             ondragover="event.preventDefault();this.classList.add('ring-2','ring-stone-400')" ondragleave="this.classList.remove('ring-2','ring-stone-400')"
             ondrop="event.preventDefault();this.classList.remove('ring-2','ring-stone-400');addFiles(event.dataTransfer.files)">
          <div id="attach-list" class="hidden flex-wrap gap-2 mb-2.5"></div>
          <input id="chat-input" type="text" onkeydown="if(event.key==='Enter') sendChatMessage()" onpaste="if(event.clipboardData.files.length){event.preventDefault();addFiles(event.clipboardData.files)}"
                 class="w-full text-sm text-stone-900 placeholder-stone-400 focus:outline-none bg-transparent" />
          <div class="flex items-center justify-between mt-2.5 pt-1">
            <div class="flex items-center gap-1.5">
              <div id="mention-bar" class="flex items-center gap-1 text-stone-500 flex-wrap"></div>
              <button onclick="$('attach-input').click()" title="Đính kèm file (hoặc kéo thả / dán)" class="w-7 h-7 rounded-lg text-stone-500 hover:text-stone-900 hover:bg-stone-100 flex items-center justify-center shrink-0"><i data-lucide="paperclip" class="w-4 h-4"></i></button>
              <input id="attach-input" type="file" multiple class="hidden" onchange="addFiles(this.files);this.value=''">
            </div>
            <button onclick="sendChatMessage()" class="w-7 h-7 rounded-full bg-stone-400 hover:bg-stone-900 text-white flex items-center justify-center transition shrink-0">
              <i data-lucide="arrow-up" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div class="h-7 flex items-center justify-between px-1 text-[11px] text-stone-600 font-medium">
          <div class="flex items-center gap-1.5 min-w-0"><span>🐝</span><span id="footer-status" class="truncate"></span></div>
          <span class="font-mono text-[10px] text-stone-400 shrink-0">claude-agent-acp • codex-acp</span>
        </div>
      </div>
    </div>

    <!-- VIEW: PROJECT OVERVIEW (danh sách workflow) -->
    <div id="view-project" class="flex-1 hidden flex-col overflow-y-auto p-6 space-y-6"></div>

    <!-- VIEW: WORKFLOW DETAIL (pipeline + tickets) -->
    <div id="view-workflow" class="flex-1 hidden flex-col overflow-y-auto p-6 space-y-6"></div>

    <!-- VIEW: AGENTS -->
    <div id="view-agents" class="flex-1 hidden flex-col overflow-y-auto p-6 space-y-8"><div id="agents-sec" class="space-y-6"></div><div id="teams-sec" class="space-y-6"></div></div>


    <!-- VIEW: INBOX -->
    <div id="view-inbox" class="flex-1 hidden flex-col overflow-y-auto p-6 space-y-6"></div>
  </main>

  <!-- ========================= MODAL ========================= -->
  <div id="modal" class="fixed inset-0 bg-stone-900/30 backdrop-blur-[2px] hidden items-center justify-center z-50 p-4" onclick="if(event.target===this) closeModal()">
    <div id="modal-box" class="bg-white rounded-2xl border border-stone-300 shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 text-xs"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 hidden bg-stone-900 text-white text-xs px-4 py-2 rounded-xl shadow-lg z-[60]"></div>

<script>
/* ================================================================
   DATA
================================================================ */
const MODELS = {
  "claude-code": ["sonnet", "opus", "haiku"],
  "codex": ["gpt-5-codex", "gpt-5"],
  "openai-api": ["gpt-5", "gpt-5-mini", "gpt-4.1"]   // gợi ý; cho nhập tự do (model của máy chủ tương thích OpenAI)
};
const RUNTIME_LABEL = { "claude-code": "Claude Code", "codex": "Codex", "openai-api": "OpenAI Custom" };
const ROLE_META = {
  BA:        { color: "amber",   perm: "Read-only",    desc: "Làm rõ lỗi với người dùng, viết kịch bản tái tạo lỗi (STR)." },
  DEVELOPER: { color: "sky",     perm: "Read / Write", desc: "Sửa mã nguồn trong workspace, không được commit." },
  TESTER:    { color: "emerald", perm: "Run Test",     desc: "Kiểm thử theo STR, báo Đạt / Chưa đạt." },
  LEADER:    { color: "purple",  perm: "Git Push",     desc: "Review diff, commit & push sau khi người dùng xác nhận." },
  SECURITY:  { color: "rose",    perm: "Read-only",    desc: "Review bảo mật trên các file vừa sửa." },
  CUSTOM:    { color: "stone",   perm: "Tuỳ chỉnh",    desc: "" }
};
const AVATAR = {
  amber: "bg-amber-100 border-amber-300 text-amber-800", sky: "bg-sky-100 border-sky-300 text-sky-800",
  emerald: "bg-emerald-100 border-emerald-300 text-emerald-800", purple: "bg-purple-100 border-purple-300 text-purple-800",
  rose: "bg-rose-100 border-rose-300 text-rose-800", stone: "bg-stone-100 border-stone-300 text-stone-700"
};
const STATUS = {
  OPEN: ["Mới", "bg-stone-100 text-stone-600"],
  RUNNING: ["Đang chạy", "bg-sky-100 text-sky-700"],
  WAITING_USER_INPUT: ["Chờ trả lời", "bg-amber-100 text-amber-800"],
  WAITING_USER_CONFIRM: ["Chờ duyệt", "bg-stone-700/15 text-stone-700"],
  COMPLETED: ["Đã xong", "bg-emerald-100 text-emerald-700"],
  FAILED: ["Lỗi", "bg-rose-100 text-rose-700"]
};

const state = {
  agents: [
    { id: "a_ba", handle: "ba", name: "Business Analyst", role: "BA", runtime: "claude-code", model: "sonnet", icon: "🐝", builtin: true, desc: ROLE_META.BA.desc },
    { id: "a_dev", handle: "developer", name: "Frontend Developer", role: "DEVELOPER", runtime: "claude-code", model: "opus", icon: "🛠️", builtin: true, desc: ROLE_META.DEVELOPER.desc },
    { id: "a_test", handle: "tester", name: "QA Tester", role: "TESTER", runtime: "codex", model: "gpt-5-codex", icon: "🧪", builtin: true, desc: ROLE_META.TESTER.desc },
    { id: "a_lead", handle: "leader", name: "Tech Lead (Git Release)", role: "LEADER", runtime: "claude-code", model: "opus", icon: "🚀", builtin: true, desc: ROLE_META.LEADER.desc },
    { id: "a_sec", handle: "security_checker", name: "Security Reviewer", role: "SECURITY", runtime: "codex", model: "gpt-5", icon: "🛡️", builtin: false, desc: "Rà soát SQL Injection, XSS, lộ secret trên các file vừa sửa." }
  ],
  teams: [
    { id: "t_core", icon: "🐝", name: "Core Bugfix Squad", desc: "Đội fix bug chuẩn: BA → Dev → Tester → Leader", agentIds: ["a_ba", "a_dev", "a_test", "a_lead"] },
    { id: "t_sec", icon: "🛡️", name: "Security Review", desc: "Review bảo mật trước khi nghiệm thu", agentIds: ["a_sec"] }
  ],
  projects: [
    {
      id: "p_hnbg", open: true, lastActivity: Date.now(), name: "HNBG_DEV", label: "HNBG_DEV (VETC)", path: "D:\\VETC\\FE\\HNBG_DEV", branch: "hotfix/reconciliation",
      teamIds: ["t_core", "t_sec"], agentIds: [], nextNumber: 105,
      workflows: [
        { id: "w_bug", name: "Fix Bug", prefix: "BUG", desc: "Chu trình fix bug 4 agent + Git release", steps: tpl("bugfix"), publishedSteps: tpl("bugfix"), version: 3, publishedVersion: 3, dirty: false, open: true },
        { id: "w_sec", name: "Fix Bug + Security", prefix: "SEC", desc: "Thêm bước review bảo mật trước khi test", steps: tpl("security"), publishedSteps: tpl("security"), version: 1, publishedVersion: 1, dirty: false, open: true },
        { id: "w_feat", name: "Làm tính năng", prefix: "FEAT", desc: "Đang thiết kế", steps: [{ type: "agent", agentId: "a_ba" }, { type: "agent", agentId: "a_dev" }], publishedSteps: null, version: 1, publishedVersion: null, dirty: true, open: true }
      ]
    }  ,
    { id: "p_portal", open: false, lastActivity: Date.now() - 3600e3, name: "VETC_PORTAL", label: "VETC_PORTAL", path: "D:\\VETC\\FE\\VETC_PORTAL", branch: "develop", teamIds: ["t_core"], agentIds: [], nextNumber: 1, workflows: [] },
    { id: "p_mobile", open: false, lastActivity: Date.now() - 86400e3, name: "ETC_MOBILE", label: "ETC_MOBILE", path: "D:\\VETC\\MOBILE\\ETC_MOBILE", branch: "main", teamIds: ["t_core"], agentIds: [], nextNumber: 1, workflows: [] }
  ],
  tickets: [],
  notifications: [], notifTab: "open",
  cur: { view: "chat", projectId: "p_hnbg", workflowId: "w_bug", ticketId: null }
};

function tpl(name) {
  if (name === "bugfix") return [{ type: "agent", agentId: "a_ba" }, { type: "agent", agentId: "a_dev" }, { type: "agent", agentId: "a_test" }, { type: "gate" }, { type: "agent", agentId: "a_lead" }];
  if (name === "security") return [{ type: "agent", agentId: "a_ba" }, { type: "agent", agentId: "a_dev" }, { type: "agent", agentId: "a_sec" }, { type: "agent", agentId: "a_test" }, { type: "gate" }, { type: "agent", agentId: "a_lead" }];
  return [];
}

/* ================================================================
   HELPERS
================================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const agent = id => state.agents.find(a => a.id === id);
const project = id => state.projects.find(p => p.id === (id || state.cur.projectId));
const workflow = (wid, p) => (p || project()).workflows.find(w => w.id === wid);
const ticket = id => state.tickets.find(t => t.id === id);
const roleColor = a => (ROLE_META[a.role] || ROLE_META.CUSTOM).color;
const now = () => new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
const slugify = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D")
  .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const statusBadge = st => `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${STATUS[st][1]}">${STATUS[st][0]}</span>`;
const pill = h => `<span class="agent-pill"><i data-lucide="bot" class="w-3 h-3"></i> ${esc(h)}</span>`;
const icons = () => lucide.createIcons();

function effectiveAgents(p) {
  const ids = new Set(p.agentIds);
  p.teamIds.forEach(tid => state.teams.find(t => t.id === tid)?.agentIds.forEach(a => ids.add(a)));
  return state.agents.filter(a => ids.has(a.id));
}
function wfStatus(w) {
  if (w.publishedVersion == null) return ["Nháp", "bg-stone-100 text-stone-500"];
  if (w.dirty) return [`v${w.publishedVersion} · có thay đổi chưa xuất bản`, "bg-amber-50 text-amber-700"];
  return [`Đã xuất bản v${w.publishedVersion}`, "bg-emerald-50 text-emerald-700"];
}
function validateSteps(steps) {
  const errs = [];
  if (!steps.some(s => s.type === "agent")) errs.push("Workflow cần ít nhất 1 bước agent.");
  if (steps[0]?.type === "gate") errs.push("Bước “Người dùng xác nhận” phải đứng sau một agent.");
  steps.forEach((s, i) => {
    if (s.type === "agent" && agent(s.agentId)?.role === "LEADER" && !steps.slice(0, i).some(x => x.type === "gate"))
      errs.push("@leader (Git Release) phải đứng sau bước “Người dùng xác nhận”.");
  });
  return errs;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), 2600);
}

/* ================================================================
   NAVIGATION & SIDEBAR
================================================================ */
function go(view, opts = {}) {
  Object.assign(state.cur, { view }, opts);
  ["chat", "project", "workflow", "agents", "inbox"].forEach(v => {
    const el = $(`view-${v}`); el.classList.toggle("hidden", v !== view); el.classList.toggle("flex", v === view);
  });
  ({ chat: renderChat, project: renderProject, workflow: renderWorkflow, agents: () => { renderAgents(); renderTeams(); }, inbox: renderInbox })[view]();
  renderSidebar();
}

function renderSidebar() {
  const p = project(), c = state.cur;
  ["inbox", "agents"].forEach(v => $(`nav-${v}`).classList.toggle("active", c.view === v));
  $("agent-count").textContent = state.agents.length + " · " + state.teams.length;
  const nOpen = state.notifications.filter(n => !n.resolvedAt).length; $("inbox-badge").textContent = nOpen; $("inbox-badge").classList.toggle("hidden", !nOpen);
  $("user-path").textContent = p ? p.path : "";

  const recent = [...state.projects].sort((a, b) => (b.lastActivity || 0) - (a.lastActivity || 0));
  let shown = recent.slice(0, 5);
  if (p && !shown.includes(p)) shown[4] = p;           // project đang mở luôn hiện, không đổi thứ tự các project còn lại
  let h = `
    <div class="px-2.5 pt-1 pb-1 flex items-center justify-between text-[11px] font-semibold text-stone-500">
      <span>Projects</span>
      <button onclick="openCreateProject()" title="Tạo project mới (bước 1)" class="hover:text-stone-900"><i data-lucide="folder-plus" class="w-3.5 h-3.5"></i></button>
    </div>`;
  shown.forEach(x => {
    const isActive = x.id === p?.id;
    h += `<div>
      <div class="side-item !py-1 ${isActive && c.view === "project" ? "active" : ""}">
        <button onclick="openProject('${x.id}')" title="${esc(x.path)}" class="flex-1 flex items-center gap-2 min-w-0 text-left">
          <i data-lucide="${x.open ? "folder-open" : "folder"}" class="w-4 h-4 ${isActive ? "text-stone-800" : "text-stone-500"} shrink-0"></i>
          <span class="truncate ${isActive ? "font-semibold" : ""}">${esc(x.label)}</span>
        </button>
        ${state.tickets.some(t => t.projectId === x.id && t.status.startsWith("WAITING")) ? `<span class="w-1.5 h-1.5 rounded-full bg-amber-500 shrink-0 mr-1.5"></span>` : ""}
        <button onclick="toggleProject('${x.id}')" title="${x.open ? "Thu gọn" : "Mở rộng"}" class="p-0.5 rounded text-stone-400 hover:text-stone-900 hover:bg-stone-300/50 shrink-0">
          <i data-lucide="${x.open ? "chevron-down" : "chevron-right"}" class="w-3.5 h-3.5"></i></button>
      </div>`;
    if (x.open) h += `<div class="ml-3 pl-1.5 border-l border-stone-300/70 space-y-0">${workflowTree(x, c)}</div>`;
    h += `</div>`;
  });
  if (recent.length > 5) h += `<button onclick="openAllProjects()" class="side-item !py-1 text-stone-500 text-xs"><span>Xem tất cả (${recent.length})</span></button>`;
  $("project-tree").innerHTML = h;
  icons();
}
function workflowTree(p, c) {
  let h = "";
  if (!p.workflows.length) {
    h += `<div class="mx-1 mt-1 p-2.5 rounded-lg border border-dashed border-stone-400/60 text-[11px] text-stone-500">

function miniPipeline(steps) {

}

  w.steps.forEach((s, i) => {

              <div><div class="text-xs font-bold text-stone-900">✋ Người dùng xác nhận (Human Gate)</div><div class="text-[11px] text-stone-500">Dừng chờ người dùng bấm Xác nhận / Chưa đạt.</div></div></div>

function stepCtl(w, i) {
  return `<div class="flex items-center text-stone-400">
    <button onclick="moveStep('${w.id}',${i},-1)" class="p-0.5 hover:text-stone-900" title="Lên"><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>
    <button onclick="moveStep('${w.id}',${i},1)" class="p-0.5 hover:text-stone-900" title="Xuống"><i data-lucide="arrow-down" class="w-3.5 h-3.5"></i></button>
    <button onclick="removeStep('${w.id}',${i})" class="p-0.5 hover:text-rose-600" title="Xoá"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div>`;
}
function touch(w) { if (!w.dirty) { w.dirty = true; if (w.publishedVersion != null) w.version++; } }
function addStep(wid) { const w = workflow(wid), v = $("add-step").value; touch(w); w.steps.push(v === "gate" ? { type: "gate" } : { type: "agent", agentId: v }); renderWorkflow(); renderSidebar(); }
function removeStep(wid, i) { const w = workflow(wid); touch(w); w.steps.splice(i, 1); renderWorkflow(); renderSidebar(); }
function moveStep(wid, i, d) { const w = workflow(wid), j = i + d; if (j < 0 || j >= w.steps.length) return; touch(w); [w.steps[i], w.steps[j]] = [w.steps[j], w.steps[i]]; renderWorkflow(); }
function publishWorkflow(wid) {
  const w = workflow(wid);
  if (validateSteps(w.steps).length) return toast("Workflow chưa hợp lệ");
  const first = w.publishedVersion == null;
  w.publishedSteps = JSON.parse(JSON.stringify(w.steps));
  w.publishedVersion = w.version; w.dirty = false;
  toast(`Đã xuất bản ${w.name} v${w.version}`);
  renderWorkflow(); renderSidebar();
  if (first) setTimeout(() => openCreateTicket(w.id, true), 400);
}

function testApiConnection() {
  const url = $("f-baseurl").value.trim(), out = $("api-test");
  if (!/^https?:\/\/[^\s/]+/i.test(url)) { out.className = "text-[11px] text-rose-600"; return out.textContent = "✘ Base URL không hợp lệ (cần http:// hoặc https://)"; }
  out.className = "text-[11px] text-stone-500"; out.textContent = "Đang kiểm tra…";
  setTimeout(() => { out.className = "text-[11px] text-emerald-700"; out.textContent = `✔ Kết nối được ${new URL(url).host} · GET /models 200 · ${120 + Math.floor(Math.random() * 200)} ms`; }, 700);
}
const apiModel = () => $("f-runtime").value === "openai-api" ? $("f-apimodel").value.trim() : $("f-model").value;
function saveAgent(aid) {
  const name = $("f-role").value.trim(), desc = $("f-prompt").value.trim();
  if (!name || !desc) return toast("Vui lòng điền vai trò và mô tả");
  const picked = [...document.querySelectorAll(".f-team:checked")].map(c => c.value);
  const rt = $("f-runtime").value, api = rt === "openai-api";
  const extra = api ? { baseUrl: $("f-baseurl").value.trim().replace(/\/+$/, ""), hasKey: true } : { baseUrl: undefined, hasKey: undefined };
  if (api) {
    if (!/^https?:\/\/[^\s/]+/i.test(extra.baseUrl)) return toast("Base URL không hợp lệ (cần http:// hoặc https://)");
    if (!apiModel()) return toast("Nhập tên model cho agent OpenAI Custom");
    if (["DEVELOPER", "TESTER", "LEADER"].includes($("f-group").value)) return toast("Agent API không sửa file/chạy lệnh — chọn nhóm quyền Chỉ đọc hoặc Tuỳ chỉnh");
    if (!aid && !$("f-apikey").value.trim()) return toast("Nhập API key");
  }
  if (aid) {
    const a = agent(aid);
    const emptied = state.teams.find(t => t.agentIds.includes(aid) && !picked.includes(t.id) && t.agentIds.length === 1);
    if (emptied) return toast(`Không bỏ được: @${a.handle} là agent duy nhất của team “${emptied.name}”`);
    const next = { name, desc, runtime: rt, model: apiModel(), role: $("f-group").value, icon: $("f-icon").value || a.icon, baseUrl: extra.baseUrl, hasKey: api ? true : undefined };
    const keyChanged = api && !!$("f-apikey").value.trim();
    const changed = keyChanged || Object.keys(next).some(k => a[k] !== next[k]);
    Object.assign(a, next);
    state.teams.forEach(t => { const has = t.agentIds.includes(aid), want = picked.includes(t.id); if (has && !want) t.agentIds = t.agentIds.filter(x => x !== aid); if (!has && want) t.agentIds.push(aid); });
    closeModal();
    if (!changed) { go("agents"); return toast("Không có thay đổi cấu hình agent, không cần khởi động lại"); }
    restartAgent(aid);
    return;
  }
  const handle = $("f-name").value.trim().replace(/^@/, "").toLowerCase();
  if (!/^[a-z0-9_\-]{2,49}$/.test(handle)) return toast("Handle không hợp lệ (a-z, 0-9, _ -)");
  if (state.agents.some(a => a.handle === handle)) return toast("Handle đã tồn tại");
  const id = "a_" + handle;
  state.agents.push({ id, handle, name, role: $("f-group").value, runtime: rt, model: apiModel(), icon: $("f-icon").value || "🤖", builtin: false, desc, ...(api ? { baseUrl: extra.baseUrl, hasKey: true } : {}) });
  picked.forEach(tid => state.teams.find(t => t.id === tid).agentIds.push(id));
  closeModal(); go("agents"); toast(`Đã tạo @${handle}`);
}
function restartAgent(id) {
  const a = agent(id); a.restarting = true;
  if (state.cur.view === "agents") go("agents");
  toast(`↻ Đang khởi động lại @${a.handle} với cấu hình mới...`);
  setTimeout(() => {
    a.restarting = false; a.restartedAt = Date.now();
    if (state.cur.view === "agents") go("agents");
    toast(`✔ @${a.handle} đã khởi động lại (${a.runtime} · ${a.model})`);
  }, 1800);
}
function deleteAgent(id) {
  const solo = state.teams.find(t => t.agentIds.length === 1 && t.agentIds[0] === id);
  if (solo) return toast(`Không xoá được: @${agent(id).handle} là agent duy nhất của team “${solo.name}”`);
  const used = state.projects.flatMap(p => p.workflows).find(w => w.steps.some(s => s.agentId === id));
  if (used) return toast(`Không xoá được: đang dùng trong workflow “${used.name}”`);
  state.teams.forEach(t => t.agentIds = t.agentIds.filter(x => x !== id));
  state.agents = state.agents.filter(a => a.id !== id);
  go("agents");
}

function suggestPrefix(n) {
  const s = slugify(n).split("-").filter(Boolean);
  if (!s.length) return "";
  return (s.length === 1 ? s[0].slice(0, 4) : s.includes("bug") ? "bug" : s.map(x => x[0]).join("").slice(0, 5)).toUpperCase();
}
function saveWorkflow() {
  const p = project(), name = $("w-name").value.trim(), prefix = $("w-prefix").value.trim().toUpperCase();
  if (!name) return toast("Nhập tên workflow");
  if (!/^[A-Z]{2,10}$/.test(prefix)) return toast("Prefix gồm 2–10 chữ cái in hoa");
  if (p.workflows.some(w => w.prefix === prefix)) return toast(`Prefix ${prefix} đã được dùng trong project`);
  if (p.workflows.some(w => w.name === name)) return toast("Tên workflow đã tồn tại");
  const eff = effectiveAgents(p).map(a => a.id);
  const steps = tpl(document.querySelector("input[name=w-tpl]:checked").value).filter(s => s.type === "gate" || eff.includes(s.agentId));
  const w = { id: "w_" + Date.now(), name, prefix, desc: $("w-desc").value, steps, publishedSteps: null, version: 1, publishedVersion: null, dirty: true, open: true };
  p.workflows.push(w);
  closeModal(); go("workflow", { workflowId: w.id });
  toast("Workflow ở trạng thái Nháp — kiểm tra luồng rồi bấm Xuất bản");
}

function runStep(t) {
  const step = t.steps[t.stepIndex];
  if (!step) { t.status = "COMPLETED"; t.typing = null; if (!/Commit/.test(t.footer)) t.footer = `<strong>Hoàn tất:</strong> ticket đã đóng.`; return rerender(t); }
  if (step.type === "gate") {
    t.status = "WAITING_USER_CONFIRM"; t.waiting = "confirm"; t.typing = null;
    t.messages.push({ kind: "confirm", resolved: null });
    notify(t, "confirm", "Xác nhận bản sửa lỗi để @leader commit & push", `Ticket #${workflow(t.workflowId, project(t.projectId)).prefix}-${t.number} đã qua kiểm thử, đang chờ bạn xác nhận.`);
    const lead = t.steps.slice(t.stepIndex).find(s => s.type === "agent");
    t.footer = `<strong>${lead ? esc(agent(lead.agentId).handle) : "workflow"}:</strong> Đang chờ người dùng xác nhận`;
    return rerender(t);
  }
  const a = agent(step.agentId);
  t.curTurn = "u" + Date.now() + Math.random().toString(36).slice(2, 5); t.status = "RUNNING"; t.typing = a.id; t.footer = `<strong>${esc(a.handle)}:</strong> đang làm việc trên ${esc(project(t.projectId).path)}...`;
  rerender(t);
  const script = logScript(a, t), STEP_MS = 420;
  script.forEach(([k, txt], i) => setTimeout(() => { if (t.typing === a.id) logLine(t, a, txt, k); }, 150 + i * STEP_MS));
  setTimeout(() => {
    t.typing = null;
    const next = () => { t.stepIndex++; rerender(t); setTimeout(() => runStep(t), 600); };
    const nextAgent = t.steps.slice(t.stepIndex + 1).find(s => s.type === "agent");
    const handoff = nextAgent ? `<p class="pt-1 text-stone-800">${pill(agent(nextAgent.agentId).handle)} bàn giao cho bạn nhé.</p>` : "";
    switch (a.role) {
      case "BA":

}

function confirmFix() {
  const t = ticket(state.cur.ticketId);
  if (t.waiting !== "confirm") return;
  t.messages.filter(m => m.kind === "confirm" && !m.resolved).forEach(m => m.resolved = "approved");
  t.messages.push({ kind: "user", time: now(), html: `${pill("leader")} Mình xác nhận đã sửa xong, nhờ Leader commit và push lên Git.` });
  resolveNotif(t, "Đã xác nhận");
  t.waiting = null; t.stepIndex++; rerender(t);
  setTimeout(() => runStep(t), 500);
}
function rejectFix() {
  const t = ticket(state.cur.ticketId);
  const fb = prompt("Nhập phản hồi chi tiết để @developer sửa lại:");
  if (!fb) return;
  t.messages.filter(m => m.kind === "confirm" && !m.resolved).forEach(m => m.resolved = "rejected");
  t.messages.push({ kind: "user", time: now(), html: `<span class="agent-pill">@developer</span> Chưa đạt: ${esc(fb)}` });
  t.messages.push({ kind: "divider", text: "Luồng quay lại @developer" });
  resolveNotif(t, "Đã từ chối, gửi lại @developer");
  t.feedback = fb; t.waiting = null;
  const devIdx = t.steps.findIndex(s => s.type === "agent" && agent(s.agentId).role === "DEVELOPER");
  t.stepIndex = devIdx >= 0 ? devIdx : 0;
  rerender(t); setTimeout(() => runStep(t), 500);
}

/* ---- Đính kèm file trong chat ---- */
const ATTACH_MAX_FILES = 5, ATTACH_MAX_MB = 10;
const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";
function fileIcon(name, type) {
  if (type.startsWith("image/")) return "image";
  if (/\.(zip|rar|7z|tar|gz)$/i.test(name)) return "file-archive";
  if (/\.(log|txt|md|json|csv|xml|ya?ml)$/i.test(name)) return "file-text";
  if (/\.(js|jsx|ts|tsx|py|java|cs|go|sql|html|css)$/i.test(name)) return "file-code";
  return "file";
}
function addFiles(list) {
  const t = ticket(state.cur.ticketId); if (!t || t.status === "COMPLETED") return;
  t.draftFiles = t.draftFiles || [];
  [...list].forEach(file => {
    if (t.draftFiles.length >= ATTACH_MAX_FILES) return toast(`Tối đa ${ATTACH_MAX_FILES} file mỗi tin nhắn`);
    if (file.size > ATTACH_MAX_MB * 1048576) return toast(`${file.name} vượt quá ${ATTACH_MAX_MB}MB`);
    const item = { name: file.name, size: file.size, type: file.type || "", preview: null };
    t.draftFiles.push(item);
    if (item.type.startsWith("image/") && file.size < 3 * 1048576) {
      const r = new FileReader(); r.onload = () => { item.preview = r.result; renderAttachList(); }; r.readAsDataURL(file);
    }
  });
  renderAttachList();
}
function removeAttach(i) { const t = ticket(state.cur.ticketId); t.draftFiles.splice(i, 1); renderAttachList(); }
function renderAttachList() {
  const t = ticket(state.cur.ticketId), box = $("attach-list"), files = (t && t.draftFiles) || [];
  box.classList.toggle("hidden", !files.length); box.classList.toggle("flex", !!files.length);
  box.innerHTML = files.map((f, i) => `<div class="relative group flex items-center gap-2 pl-1.5 pr-6 py-1 rounded-lg border border-stone-200 bg-stone-50 max-w-[220px]">
    ${f.preview ? `<img src="${f.preview}" class="w-8 h-8 rounded object-cover">` : `<span class="w-8 h-8 rounded bg-stone-200 flex items-center justify-center"><i data-lucide="${fileIcon(f.name, f.type)}" class="w-4 h-4 text-stone-600"></i></span>`}
    <span class="min-w-0"><span class="block text-[11px] font-medium text-stone-800 truncate">${esc(f.name)}</span><span class="block text-[10px] text-stone-400">${fmtSize(f.size)}</span></span>
    <button onclick="removeAttach(${i})" title="Bỏ file" class="absolute top-1 right-1 text-stone-400 hover:text-rose-600"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div>`).join("");
  icons();
}
function attachHtml(files) {
  return `<div class="flex flex-wrap gap-2 mt-1.5">${files.map(f => f.preview
    ? `<a class="block"><img src="${f.preview}" title="${esc(f.name)}" class="max-h-40 max-w-[260px] rounded-lg border border-stone-200 object-cover"></a>`
    : `<span class="inline-flex items-center gap-2 px-2.5 py-1.5 rounded-lg border border-stone-200 bg-stone-50 text-xs"><i data-lucide="${fileIcon(f.name, f.type)}" class="w-4 h-4 text-stone-600"></i><span class="font-medium text-stone-800">${esc(f.name)}</span><span class="text-stone-400">${fmtSize(f.size)}</span></span>`).join("")}</div>`;
}
function quickMention(tag) {
  if (state.cur.view !== "chat") return;
  const i = $("chat-input"); i.value = tag + i.value; i.focus();
}
function sendChatMessage() {
  const t = ticket(state.cur.ticketId), i = $("chat-input");
  let text = i.value.trim();
  const files = (t && t.draftFiles) || [];
  if (!t || (!text && !files.length)) return;
  const dm = defaultAgent();
  if (dm && !/@[a-z0-9_\-]+/i.test(text)) text = `@${dm.handle} ${text}`.trim();
  i.value = ""; t.draftFiles = []; renderAttachList();
  const low = text.toLowerCase();
  if (t.waiting === "confirm" && low.includes("@leader") && /(confirm|done|ok|đã fix|xác nhận)/.test(low)) return confirmFix();
  t.messages.push({ kind: "user", time: now(), html: esc(text).replace(/@([a-z0-9_\-]+)/g, (_, h) => pill(h)) + (files.length ? attachHtml(files) : "") });
  if (files.length) t.lastAttachments = files.map(f => f.name);
  if (t.waiting === "input") { resolveNotif(t, "Đã trả lời"); t.waiting = null; t.lastAnswer = text; t.status = "RUNNING"; rerender(t); return setTimeout(() => runStep(t), 500); }
  rerender(t);
}
