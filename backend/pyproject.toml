[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiteams-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "python-jose[cryptography]>=3.4,<4", "passlib[bcrypt]>=1.7,<2", "pyyaml>=6,<7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Small synchronous file operations and per-request timeouts are intentional in the diagnostic harness.
"scripts/acp_spike.py" = ["ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts"]
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.acp.*", "app.engine.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
