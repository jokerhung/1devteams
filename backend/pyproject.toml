[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiteams-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "python-jose[cryptography]>=3.4,<4", "passlib[bcrypt]>=1.7,<2", "pyyaml>=6,<7",
  "httpx>=0.28,<1", "bcrypt>=4,<6", "cryptography>=43", "pillow>=11,<13",
  "python-multipart>=0.0.20", "filetype>=1.2,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-python-jose"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Small synchronous file operations and per-request timeouts are intentional in the diagnostic harness.
"scripts/acp_spike.py" = ["ASYNC109", "ASYNC240"]
"app/acp/jsonrpc.py" = ["ASYNC109"]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts"]
check_untyped_defs = true
plugins = ["pydantic.mypy"]
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["app.acp.*", "app.engine.*"]
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
warn_unused_ignores = true
strict_equality = true
disallow_incomplete_defs = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["filetype"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not real_acp and not real_api'"
markers = ["real_acp: opt-in live CLI tests in disposable workspaces", "real_api: opt-in live OpenAI-compatible API tests"]
